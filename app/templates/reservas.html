{% extends "base.html" %}{% block t %}Reservas{% endblock %}{% block c %}
<h1>Reservas</h1>
<table><tr><th>#</th><th>Nombre</th><th>Fecha</th><th>Hora</th><th>Personas</th></tr>
{% for r in reservas %}<tr><td>{{ r.id }}</td><td>{{ r.nombre }}</td><td>{{ r.fecha }}</td>
<td>{{ r.hora }}</td><td>{{ r.personas }}</td></tr>{% endfor %}
</table>
<h3 style="margin-top:20px">Nueva reserva</h3>
<form method="post" action="/reservas/crear">
 <input name="nombre" placeholder="Nombre">
 <input name="fecha" type="date">
 <input name="hora" type="time">
 <select name="personas"><option>2</option><option>4</option><option>6</option></select>
 <button type="submit">Reservar</button>
</form>
{% endblock %}
