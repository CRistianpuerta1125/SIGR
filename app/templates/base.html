<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<title>SIGR — {% block t %}{% endblock %}</title>
<style>
 body{font-family:system-ui,Arial,sans-serif;margin:0;background:#f4f6fa;color:#243b55}
 header{background:#1f3864;color:#fff;padding:12px 24px;display:flex;gap:16px;align-items:center;flex-wrap:wrap}
 header a{color:#cfe0f5;text-decoration:none;font-size:14px}
 header .brand{font-weight:bold;font-size:18px;margin-right:12px}
 main{max-width:880px;margin:24px auto;background:#fff;padding:24px;border-radius:8px;box-shadow:0 2px 8px rgba(0,0,0,.08)}
 h1{color:#1f3864} table{border-collapse:collapse;width:100%} td,th{padding:8px;border-bottom:1px solid #e3e9f1;text-align:left}
 input,select{padding:7px;border:1px solid #c3cedd;border-radius:4px;margin:3px 0}
 button,.btn{padding:8px 14px;background:#1f3864;color:#fff;border:0;border-radius:4px;cursor:pointer;text-decoration:none;font-size:13px}
 .flash{background:#fdecea;color:#922b21;padding:8px 12px;border-radius:4px;margin-bottom:12px}
 .tag{background:#eef2f7;padding:2px 8px;border-radius:10px;font-size:12px}
</style></head><body>
{% if session.usuario %}
<header><span class="brand">SIGR</span>
 <a href="/panel">Panel</a><a href="/menu">Menú</a><a href="/pedidos">Pedidos</a>
 <a href="/reservas">Reservas</a><a href="/caja">Caja</a>
 <span style="margin-left:auto">{{ session.usuario }} ({{ session.rol }}) · <a href="/salir">Salir</a></span>
</header>
{% endif %}
<main>
 {% with m = get_flashed_messages() %}{% if m %}<div class="flash">{{ m[0] }}</div>{% endif %}{% endwith %}
 {% block c %}{% endblock %}
</main></body></html>
